<button class="theme-toggle-btn" (click)="themeService.toggleTheme()" aria-label="Toggle Dark Mode">
  <svg width="100%" height="100%" viewBox="0 0 200 200">
    <defs>
      <mask id="hole">
        <rect width="100%" height="100%" fill="white" />
        <circle id="overlay" r="80" cx="230" cy="-30" fill="black" [class.mooned]="themeService.darkModeSignal() === 'dark'"/>
      </mask>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="gold" />
      </filter>
    </defs>
    <g filter="url(#blur)">
      <circle id="donut" r="80" cx="100" cy="100" mask="url(#hole)"/>
    </g>
  </svg>
</button>

<div class="header">
  <div class="logo-mask" alt="Logo"></div>
</div>
